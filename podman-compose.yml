# OVERWATCH Podman Compose Configuration
# Enterprise-grade process monitoring and remediation system

version: '3.8'

services:
  # Prometheus - Metrics collection and alerting
  prometheus:
    image: prom/prometheus:latest
    container_name: overwatch-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks:
      - overwatch-net

  # Alertmanager - Alert routing and management
  alertmanager:
    image: prom/alertmanager:latest
    container_name: overwatch-alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    environment:
      - WEBHOOK_TOKEN=${WEBHOOK_TOKEN:-overwatch-secret-token}
    restart: unless-stopped
    networks:
      - overwatch-net

  # Grafana - Visualization and dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: overwatch-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=
    restart: unless-stopped
    networks:
      - overwatch-net

  # AI Layer - Flask webhook for LLM reasoning
  ai_layer:
    build:
      context: .
      dockerfile: Dockerfile.ai_layer
    container_name: overwatch-ai-layer
    ports:
      - "5000:5000"
    volumes:
      - ./database:/app/database
      - ./ai_layer:/app/ai_layer:ro
    environment:
      - OLLAMA_PROXY_URL=${OLLAMA_PROXY_URL:-http://host.docker.internal:8081}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - WEBHOOK_TOKEN=${WEBHOOK_TOKEN:-overwatch-secret-token}
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - overwatch-net
    depends_on:
      - prometheus

  # Streamlit UI - Human-in-the-loop dashboard
  streamlit_ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: overwatch-ui
    ports:
      - "8501:8501"
    volumes:
      - ./database:/app/database
      - ./ui:/app/ui:ro
    environment:
      - EXECUTOR_URL=${EXECUTOR_URL:-http://host.docker.internal:8080}
      - EXECUTOR_TOKEN=${EXECUTOR_TOKEN:-executor-secret-token}
    restart: unless-stopped
    networks:
      - overwatch-net
    depends_on:
      - ai_layer

networks:
  overwatch-net:
    driver: bridge

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
